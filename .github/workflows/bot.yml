name: bot

on:
  push:
    paths: [Dockerfile, .dockerignore, fly.toml, "deploy/**", "bot/**", "scripts/lib/**", "web/**", package.json, package-lock.json, .github/workflows/bot.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: npm ci
      # Mocked Telegram and LLM; no secrets.
      - run: npm test -w bot

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      # Same install and build as Vercel (root directory web/).
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: The test-only signer is not in the production bundle
        run: "! grep -l __ROTA_DEV_SIGNER__ dist/assets/*.js"

  docker-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rota-bot .
      - name: Starts, loads every module, and stops cleanly without config
        run: |
          out=$(docker run --rm rota-bot 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Not starting: missing configuration: TELEGRAM_BOT_TOKEN, NEAR_RPC_URL, ROTA_CONTRACT_ID"
      - name: Fly.io stage gives a root-owned volume to node and runs the bot as node
        run: |
          docker build --target fly -t rota-bot-fly .
          out=$(docker run --rm rota-bot-fly 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Not starting: missing configuration"
          mkdir -p /tmp/flydata && sudo chown root:root /tmp/flydata && sudo chmod 755 /tmp/flydata
          echo '{"imported":true}' | sudo tee /tmp/flydata/import-state.json >/dev/null
          docker run --rm -v /tmp/flydata:/data rota-bot-fly sh -c 'id -un && touch /data/written && cat /data/state.json' | tee out.txt
          grep -qx node out.txt && grep -q imported out.txt && test ! -e /tmp/flydata/import-state.json
      - name: No secrets or build output in the image
        run: |
          docker run --rm --entrypoint sh rota-bot -c '
            set -e
            test ! -e /app/.env && test ! -e /app/credentials && test ! -e /app/contract && test ! -e /app/BRIEF.md
            test ! -e /app/node_modules/near-sandbox
            id -un | grep -qx node
            echo "image contents ok"'
