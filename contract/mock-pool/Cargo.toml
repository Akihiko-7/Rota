[package]
name = "rota-mock-pool"
version = "1.0.0"
edition = "2021"
description = "Sandbox-only staking pool with the same methods, arguments and share maths as near/core-contracts staking-pool."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
