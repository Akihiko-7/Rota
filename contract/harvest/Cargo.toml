[package]
name = "rota-harvest"
version = "1.0.0"
edition = "2021"
description = "Rota Harvest: group staking pot. Deposits are staked with one validator pool and returned pro-rata with rewards."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
