[package]
name = "rota-mock-ft"
version = "1.0.0"
edition = "2021"
description = "Mock NEP-141 for testnet and sandbox: anyone can mint. Not for mainnet."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
