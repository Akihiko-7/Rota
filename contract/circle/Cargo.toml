[package]
name = "rota-circle"
version = "1.0.0"
edition = "2021"
description = "Rota savings circle: holds contributions and pays each round to the scheduled member"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
